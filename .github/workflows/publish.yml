name: Publish dex

# Dex and sign every library version that libraries.txt reaches and the repository doesn't hold yet, then
# commit the new archives. Uses the CodeAssist CLI from a CodeAssist release (`codeassist-cli.zip`), so the dex
# is made by that release's own D8 and lands under its flavor.
on:
  push:
    branches: [ main ]
    paths: [ libraries.txt, .github/workflows/publish.yml ]
  workflow_dispatch:
    inputs:
      cli:
        description: "CodeAssist release tag whose CLI to use (blank = latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The CLI dexes against android.jar from an installed SDK platform.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"

      - name: Download the CodeAssist CLI
        run: |
          set -euo pipefail
          tag="${{ inputs.cli }}"
          if [ -z "$tag" ]; then
            url="https://github.com/tyron12233/CodeAssist/releases/latest/download/codeassist-cli.zip"
          else
            url="https://github.com/tyron12233/CodeAssist/releases/download/$tag/codeassist-cli.zip"
          fi
          curl -fsSL "$url" -o "$RUNNER_TEMP/cli.zip"
          unzip -q "$RUNNER_TEMP/cli.zip" -d "$RUNNER_TEMP/cli"
          echo "CLI=$RUNNER_TEMP/cli/codeassist/bin/codeassist" >> "$GITHUB_ENV"

      - name: Dex and sign new libraries
        env:
          DEX_SIGNING_KEY: ${{ secrets.DEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEX_SIGNING_KEY" ]; then echo "::error::the DEX_SIGNING_KEY secret is not set"; exit 1; fi
          key="$RUNNER_TEMP/key.pk8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$DEX_SIGNING_KEY" | base64 -d > "$key"
          "$CLI" dexrepo --repo . --key "$key" --libraries libraries.txt --cache "$RUNNER_TEMP/caches"

      - name: Commit new archives
        run: |
          set -euo pipefail
          git add dex
          if git diff --cached --quiet; then echo "Nothing new to publish."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish dex for $(git diff --cached --name-only | wc -l | tr -d ' ') new archive(s)"
          git push
